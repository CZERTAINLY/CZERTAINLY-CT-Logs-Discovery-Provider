sonar.projectKey=ilm-CT-Logs-Discovery-Provider
sonar.organization=ilm

sonar.go.coverage.reportPaths=coverage.out
sonar.go.golangci-lint.reportPaths=golangci-lint-report.xml

sonar.test.inclusions=**/*_test.go
# The generated SSLMate API client is excluded from all analysis: it is
# regenerated, not hand-maintained. The OpenAPI model DTOs stay in analysis
# scope because they are edited by hand often enough for their findings to
# matter; they are excluded from coverage only, below.
sonar.exclusions=internal/sslmate/**
# The generated DTOs and the thin main wiring have no meaningful unit coverage
# and must not drag the coverage ratio down.
sonar.coverage.exclusions=**/*_test.go,internal/model/**,internal/sslmate/**,cmd/main.go
